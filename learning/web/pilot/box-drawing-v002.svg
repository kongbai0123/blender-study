<text x="45" y="947" class="block">尺寸公差、幾何公差、檢驗及配合要求：待定；實體列印、量測與試配：未執行。</text>
<text x="45" y="974" class="block">來源 STL 無單位標記，依本教材按毫米解讀。請以標註數字為準，勿量螢幕或列印影像。</text>
