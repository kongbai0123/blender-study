<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 1050" role="img" aria-labelledby="title desc"><title id="title">CAD Sketcher 約束截面尺寸變更</title><desc id="desc">實際 GUI 生成、另存及獨立讀取的 XY 三角草圖，展示截面高度 0.6 與 0.8 mm；不等於螺距。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#244f6e"/></marker></defs><rect width="1550" height="1050" fill="white"/><rect x="20" y="20" width="1510" height="1010" fill="none" stroke="#173548" stroke-width="3"/>
<g font-family="Microsoft JhengHei,sans-serif" fill="#173548"><text x="50" y="60" font-size="28" font-weight="700">CAD Sketcher 約束截面：兩個已存尺寸狀態</text><text x="50" y="90" font-size="17">從 Blender 已存草圖的真實頂點與約束讀值製圖；不是 Blender 介面截圖。</text><text x="130" y="155" font-size="22" font-weight="700">還原 0.6 mm（XY）</text><text x="790" y="155" font-size="22" font-weight="700">更改 0.8 mm（XY）</text></g>
<g fill="none" stroke="#193548" stroke-width="3"><polygon points="240.000,530.000 600.000,440.000 240.000,350.000"/><polygon points="900.000,530.000 1251.141,410.000 900.000,290.000"/></g>
<g fill="#ac552a"><circle cx="240.000" cy="530.000" r="5"/><circle cx="900.000" cy="530.000" r="5"/></g>
<g stroke="#244f6e" fill="none" stroke-width="1.3"><path d="M240.000 530.000H185 M240.000 350.000H185"/><line x1="195" y1="530.000" x2="195" y2="350.000" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M900.000 530.000H845 M900.000 290.000H845"/><line x1="855" y1="530.000" x2="855" y2="290.000" marker-start="url(#arrow)" marker-end="url(#arrow)"/></g>
<g font-family="Microsoft JhengHei,sans-serif" fill="#173548" font-size="19"><text x="174" y="430" transform="rotate(-90 174 430)">截面高度 0.600</text><text x="834" y="430" transform="rotate(-90 834 430)">截面高度 0.800</text><text x="612.000" y="440.000">尖點 X=6.000</text><text x="1263.141" y="410.000">尖點 X=5.97047</text><text x="240" y="570">X →　Y ↑；橘點為固定基準點</text><text x="900" y="570">X →　Y ↑；左下基準位置未變</text><text x="240" y="220">斜邊 Distance 1.236932 mm</text><text x="900" y="220">斜邊 Distance 1.236932 mm</text></g>
<path d="M20 640H1530 M1010 640V1030 M1270 640V1030" fill="none" stroke="#173548" stroke-width="2"/><g font-family="Microsoft JhengHei,sans-serif" fill="#173548" font-size="17"><text x="45" y="675">兩個 Distance、Equal、Vertical；左下點為固定屬性。求解器 OKAY，DoF 0。</text><text x="45" y="705">P1 約 (4.8, 0) mm 固定；0.6→0.8 mm 時，兩斜邊等長，尖點 X 改變。</text><text x="45" y="735">0.6、0.8 是 XY 截面高度，不是螺距；此圖未建立 XZ 螺旋或三維實體。</text><text x="45" y="765">非 ISO 牙型；材料、公差、列印、量測、試配與強度均待定。</text><text x="45" y="795">0.6 還原場景 SHA：f45cb87cb9084bb9ca92612d6dc8726c28f7abfd099954e14ea4964975dd8508</text><text x="45" y="825">0.8 改動場景 SHA：8811cfc5223560a5397324dc0d1a61657a42efd301c038c69c7d259fc36c9c70</text><text x="45" y="855">圖中連線直接使用兩份獨立讀取的草圖頂點；尺寸為名義數位值，勿量螢幕。</text><text x="1030" y="675">圖名：約束截面</text><text x="1030" y="705">版次：v001</text><text x="1030" y="735">用途：教學草案</text><text x="1290" y="675">單位：mm</text><text x="1290" y="705">比例：隨畫面</text><text x="1290" y="735">實體試配：未做</text></g></svg>
