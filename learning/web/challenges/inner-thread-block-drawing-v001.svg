<g stroke="#46566b" fill="none" stroke-width="1.3"><path d="M99 110 V74 M531 110 V74 M99 87 H531" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M99 109 H55 M99 541 H55 M71 109 V541" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M739 204 V153 M1171 204 V153 M739 167 H1171" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M1171 204 H1220 M1171 285 H1220 M1205 204 V285" marker-end="url(#arrow)" marker-start="url(#arrow)"/></g><g font-family="Microsoft JhengHei, sans-serif" font-size="18" fill="#14253e"><text x="297" y="82">16</text><text x="42" y="331" transform="rotate(-90 42 331)">16</text><text x="936" y="161">16</text><text x="1230" y="251">3</text><text x="95" y="570">X →　　Y ↑</text><text x="739" y="320">X →　　Z ↑</text><text x="711" y="359">剖切線由已存網格三角面求交，並非標準牙型符號。</text><text x="711" y="394">切面偏離中心 0.123456 mm，以避免與網格接縫重合。</text><text x="711" y="429">牙端被試塊上下表面截斷；導入段尚未設計。</text><text x="711" y="464">實際曲面及其局部截線依網格多邊形近似。</text></g>
<g font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" fill="#14253e" font-size="18"><text x="62" y="623" font-weight="700">草案與限制</text><text x="62" y="654">尺寸單位：mm；16 × 16 × 3 為名義尺寸。以程式預建外牙草案作 Boolean 工具。</text><text x="62" y="686">工具輸入：半徑 5–6 mm、單線、螺距 1 mm；上述為建模參數，僅有局部射線抽樣核對。</text><text x="62" y="718">無配合間隙補償；非 ISO 牙型、非盒蓋或已驗證的對件。材料、製造規格與公差待定。</text><text x="62" y="750">實體列印、量測、試配及強度均未驗證；非流形邊 0 不代表可列印或配合合格。</text><text x="62" y="805" font-weight="700">來源：u08_inner_boolean_trial_v003.blend ／ 物件 Cube ／ 保存後重開版本</text><text x="62" y="836" font-size="15">來源 SHA-256：a312d1942c8198bff9ef97a18adc7a89d2f0eb882a890710dc11c8782cc74a80</text><text x="62" y="866" font-size="15">俯視輪廓取頂面三角網格邊界；剖面為 mesh 與平面求交。圖面為教學草案，非正式製造圖。</text><text x="62" y="897" font-size="15">版本：inner-thread-block-drawing-v001　　來源 Blender 5.2.1 LTS　　投影：俯視及剖面</text></g></svg>