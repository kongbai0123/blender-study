<text x="55" y="1060" class="big">比較與驗證範圍</text>
<text x="55" y="1095" class="small">L 是幾何根平面至扣鉤承接面的距離，不是已測定的力學有效長度；端部與臂頂另有 2 mm。</text>
<text x="55" y="1129" class="small">A／B／C 為獨立 anchor + 臂 + 鉤；不等同原盒、上蓋或已指定的試扣對件。</text>
<text x="55" y="1163" class="small">材料、允許應變、根部柔度、夾持與試驗載入條件：待定；未評估強度、改善或合格。</text>
<text x="55" y="1197" class="small">列印方向及支撐僅候選；尚未切片、列印、量測或試配。原 STL 坐標已保留候選旋轉與分列位置。</text>
<text x="55" y="1231" class="small">各截面僅為圖面 Y 對齊以利比較，未改 STL；請以名義標註為準，勿量螢幕或影像。</text>
