<text x="55" y="1368" class="small">A/B/C 世界外框依序約 24／22／26 × 4.6 × 9 mm；STL 無單位標記。</text>
<text x="55" y="1402" class="small">定位、夾持及有效機械長待定；圖面僅供教學，不作正式製造、驗收或強度認定。</text>
