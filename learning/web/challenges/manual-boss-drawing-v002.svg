<text x="45" y="1162" class="small">來源 SHA-256：fdeaccd41f4c73d8…；單位：mm；以標註值為準，勿量螢幕。</text><text x="45" y="1190" class="small">Inset 2 mm 的結果實讀孔口約 3.981 mm，不能把 4 mm 視為實際孔口。</text>
