<g font-family="Microsoft JhengHei,sans-serif" fill="#173548" font-size="18"><text x="330" y="483" text-anchor="middle">60 mm</text><text x="64" y="320" transform="rotate(-90 64 320)">40 mm</text><text x="1285" y="148" fill="#ac552a">下方環形唇邊</text><text x="1320" y="245" fill="#ac552a">蓋板</text><text x="110" y="690">B</text><text x="110" y="950">藍：盒體　橘：蓋板與下方唇邊</text><text x="820" y="960">僅名義位置；各方向間隙仍待實體試配。</text><text x="1080" y="695" fill="#ac552a">蓋板</text><text x="1190" y="820" fill="#ac552a">唇邊</text><text x="1000" y="865" fill="#1c4969">盒壁</text><text x="110" y="980">A–A 為 Y=0.123456 mm 的網格截線，非剖面填色。</text></g>
