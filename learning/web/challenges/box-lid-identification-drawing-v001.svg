<g font-family="Microsoft JhengHei,sans-serif" fill="#173548" font-size="17"><text x="45" y="1055">盒體外框約 60 × 40 × 30 mm；盒壁及底名義 2 mm。</text><text x="45" y="1085">蓋板 60 × 40 × 2 mm；下方環形唇邊深 4 mm、壁名義 2 mm。</text><text x="45" y="1115">唇邊外框 55.6 × 35.6 mm；內口 51.6 × 31.6 mm，來源為已存網格。</text><text x="45" y="1145">盒口與唇邊同方向名義總間隙 0.4 mm；置中時單側名義 0.2 mm，均為試驗值。</text><text x="45" y="1175">可見邊為抽樣投影，非完整標準隱線；剖切為實際三角面與平面求交。</text><text x="45" y="1205">材料、公差、列印、量測與實體試配待定；不可由此圖推定配合合格。</text><text x="45" y="1235">來源 SHA-256：ab08f331dcb26c5ffc6c6ca56c7c7f022df96791c4777e37c5f01a964fbed6ff；工程目標圖非 Blender 介面畫面。</text><text x="1030" y="1055">圖名：盒與環形唇邊</text><text x="1030" y="1085">版次：v001</text><text x="1030" y="1115">用途：辨認草案</text><text x="1320" y="1055">單位：mm</text><text x="1320" y="1085">比例：隨畫面</text><text x="1320" y="1115">實體試配：未做</text></g></svg>
